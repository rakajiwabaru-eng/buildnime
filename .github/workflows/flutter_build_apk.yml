name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP source project"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Download source ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -n "$ZIP_URL" || { echo "zip_url kosong"; exit 1; }

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ZIP_URL" \
            --output "$RUNNER_TEMP/source.zip"

          echo "ZIP size: $(wc -c < "$RUNNER_TEMP/source.zip") bytes"

          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"

          # Cari folder yang punya pubspec.yaml + lib/main.dart
          PROJECT_DIR=""
          while IFS= read -r pub; do
            dir="$(dirname "$pub")"
            if [ -f "$dir/lib/main.dart" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find "$RUNNER_TEMP/source" -name pubspec.yaml -type f)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project Flutter tidak lengkap (butuh pubspec.yaml + lib/main.dart)"
            find "$RUNNER_TEMP/source" -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "Project Flutter: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/
          test -f "$GITHUB_WORKSPACE/pubspec.yaml"
          test -f "$GITHUB_WORKSPACE/lib/main.dart"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          if-no-files-found: error
